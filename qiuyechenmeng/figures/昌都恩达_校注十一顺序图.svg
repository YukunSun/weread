<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2640" viewBox="0 0 1400 2640" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">昌都至恩达：校注十一地名顺序与探险经过</title><desc id="figure-desc">纵向十一节点示意，无比例尺、无经纬度。蓝色为自行侦探，橙色为纳贡塘附近被俘，紫色为押送至恩达。另列获释返程、里数差异和书图限制。</desc><defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}a:focus rect{stroke:#142b40;stroke-width:4}</style><marker id="arrow-scout" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215d83" /></marker><marker id="arrow-capture" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#965513" /></marker><marker id="arrow-escort" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#694e85" /></marker><marker id="arrow-return" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#346d58" /></marker><marker id="arrow-maponly" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657269" /></marker></defs><rect width="1400" height="2640" fill="#f5f3ed" /><text x="76" y="94" font-size="43" fill="#26332f" font-weight="700"><tspan x="76" dy="0">昌都—恩达：探险、被俘与押送</tspan></text><text x="78" y="146" font-size="26" fill="#26332f" font-weight="400"><tspan x="78" dy="0">按正文与校注十一订正地名；陈渠珍实际抵达恩达，后获释返回昌都。</tspan></text><text x="78" y="189" font-size="25" fill="#6d5743" font-weight="600"><tspan x="78" dy="0">顺序示意  ·  无比例尺  ·  无经纬度  ·  原述里数不换算 km</tspan></text><rect x="78" y="222" width="20" height="20" rx="4" fill="#215d83" /><text x="109" y="240" font-size="21" fill="#215d83" font-weight="600"><tspan x="109" dy="0">自行侦探</tspan></text><rect x="338" y="222" width="20" height="20" rx="4" fill="#965513" /><text x="369" y="240" font-size="21" fill="#965513" font-weight="600"><tspan x="369" dy="0">纳贡塘附近被俘</tspan></text><rect x="638" y="222" width="20" height="20" rx="4" fill="#694e85" /><text x="669" y="240" font-size="21" fill="#694e85" font-weight="600"><tspan x="669" dy="0">押送至恩达</tspan></text><rect x="898" y="222" width="20" height="20" rx="4" fill="#346d58" /><text x="929" y="240" font-size="21" fill="#346d58" font-weight="600"><tspan x="929" dy="0">获释返程</tspan></text><rect x="1158" y="222" width="20" height="20" rx="4" fill="#657269" /><text x="1189" y="240" font-size="21" fill="#657269" font-weight="600"><tspan x="1189" dy="0">仅据书图</tspan></text><a href="昌都恩达_校注十一对读.html#detail-chamdo" aria-label="查看昌都明细"><rect x="76" y="294" width="704" height="148" rx="15" fill="#edf4f7" stroke="#215d83" stroke-width="1.8" /><text x="100" y="336" font-size="31" fill="#215d83" font-weight="700"><tspan x="100" dy="0">01  昌都</tspan></text><text x="590" y="334" font-size="20" fill="#215d83" font-weight="600"><tspan x="590" dy="0">自行侦探</tspan></text><text x="101" y="377" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">识读：高</tspan></text><text x="101" y="416" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">出发地；第三日午夜返抵。</tspan></text></a><path d="M 428 446 V 476" stroke="#215d83" stroke-width="3" fill="none" marker-end="url(#arrow-scout)" /><a href="昌都恩达_校注十一对读.html#detail-xizangqiao" aria-label="查看西藏桥明细"><rect x="76" y="492" width="704" height="148" rx="15" fill="#edf4f7" stroke="#215d83" stroke-width="1.8" /><text x="100" y="534" font-size="31" fill="#215d83" font-weight="700"><tspan x="100" dy="0">02  西藏桥</tspan></text><text x="590" y="532" font-size="20" fill="#215d83" font-weight="600"><tspan x="590" dy="0">自行侦探</tspan></text><text x="101" y="575" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">识读：高</tspan></text><text x="101" y="614" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">正文、书图均另列；与俄洛桥的称名关系未定。</tspan></text></a><path d="M 428 644 V 674" stroke="#215d83" stroke-width="3" fill="none" marker-end="url(#arrow-scout)" /><a href="昌都恩达_校注十一对读.html#detail-eluoqiao" aria-label="查看俄洛桥明细"><rect x="76" y="690" width="704" height="148" rx="15" fill="#edf4f7" stroke="#215d83" stroke-width="1.8" /><text x="100" y="732" font-size="31" fill="#215d83" font-weight="700"><tspan x="100" dy="0">03  俄洛桥</tspan></text><text x="590" y="730" font-size="20" fill="#215d83" font-weight="600"><tspan x="590" dy="0">自行侦探</tspan></text><text x="101" y="773" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">识读：高</tspan></text><text x="101" y="812" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">首晚留宿边军哨营；次晨再行。</tspan></text></a><path d="M 428 842 V 872" stroke="#657269" stroke-width="3" fill="none" marker-end="url(#arrow-maponly)" /><a href="昌都恩达_校注十一对读.html#detail-jialingtang" aria-label="查看甲令塘明细"><rect x="76" y="888" width="704" height="148" rx="15" fill="#f0f1ec" stroke="#657269" stroke-width="1.8" /><text x="100" y="930" font-size="31" fill="#657269" font-weight="700"><tspan x="100" dy="0">04  甲令塘</tspan></text><text x="590" y="928" font-size="20" fill="#657269" font-weight="600"><tspan x="590" dy="0">仅据书图</tspan></text><text x="101" y="971" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">识读：中</tspan></text><text x="101" y="1010" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">仅据书图；“令”字识读仍待复核。</tspan></text></a><path d="M 428 1040 V 1070" stroke="#215d83" stroke-width="3" fill="none" marker-end="url(#arrow-scout)" /><a href="昌都恩达_校注十一对读.html#detail-langdanggou" aria-label="查看浪荡沟明细"><rect x="76" y="1086" width="704" height="148" rx="15" fill="#edf4f7" stroke="#215d83" stroke-width="1.8" /><text x="100" y="1128" font-size="31" fill="#215d83" font-weight="700"><tspan x="100" dy="0">05  浪荡沟</tspan></text><text x="590" y="1126" font-size="20" fill="#215d83" font-weight="600"><tspan x="590" dy="0">自行侦探</tspan></text><text x="101" y="1169" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">别名：腊左塘</tspan></text><text x="101" y="1208" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">原书“腊左塘”；次晨经过塘房。</tspan></text></a><path d="M 428 1238 V 1268" stroke="#215d83" stroke-width="3" fill="none" marker-end="url(#arrow-scout)" /><a href="昌都恩达_校注十一对读.html#detail-nagongshan" aria-label="查看纳贡山明细"><rect x="76" y="1284" width="704" height="148" rx="15" fill="#edf4f7" stroke="#215d83" stroke-width="1.8" /><text x="100" y="1326" font-size="31" fill="#215d83" font-weight="700"><tspan x="100" dy="0">06  纳贡山</tspan></text><text x="590" y="1324" font-size="20" fill="#215d83" font-weight="600"><tspan x="590" dy="0">自行侦探</tspan></text><text x="101" y="1367" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">别名：腊左大山；藏名安初拉〔识读中高〕</tspan></text><text x="101" y="1406" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">翻山进入另一谷地；具体山口未定位。</tspan></text></a><path d="M 428 1436 V 1466" stroke="#965513" stroke-width="3" fill="none" marker-end="url(#arrow-capture)" /><a href="昌都恩达_校注十一对读.html#detail-nagongtang" aria-label="查看纳贡塘明细"><rect x="76" y="1482" width="704" height="148" rx="15" fill="#fff4df" stroke="#965513" stroke-width="1.8" /><text x="100" y="1524" font-size="31" fill="#965513" font-weight="700"><tspan x="100" dy="0">07  纳贡塘</tspan></text><text x="590" y="1522" font-size="20" fill="#965513" font-weight="600"><tspan x="590" dy="0">纳贡塘附近被俘</tspan></text><text x="101" y="1565" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">别名：腊左</tspan></text><text x="101" y="1604" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">原书“腊左”；投宿后遭俘。</tspan></text></a><path d="M 428 1634 V 1664" stroke="#694e85" stroke-width="3" fill="none" marker-end="url(#arrow-escort)" /><a href="昌都恩达_校注十一对读.html#detail-jiamuqiao" aria-label="查看甲木桥明细"><rect x="76" y="1680" width="704" height="148" rx="15" fill="#f3eff7" stroke="#694e85" stroke-width="1.8" /><text x="100" y="1722" font-size="31" fill="#694e85" font-weight="700"><tspan x="100" dy="0">08  甲木桥</tspan></text><text x="590" y="1720" font-size="20" fill="#694e85" font-weight="600"><tspan x="590" dy="0">押送至恩达</tspan></text><text x="101" y="1763" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">别名：并达桥</tspan></text><text x="101" y="1802" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">原书“并达桥”；被俘后押送途中经过。</tspan></text></a><path d="M 428 1832 V 1862" stroke="#694e85" stroke-width="3" fill="none" marker-end="url(#arrow-escort)" /><a href="昌都恩达_校注十一对读.html#detail-suoluoba" aria-label="查看梭罗坝明细"><rect x="76" y="1878" width="704" height="148" rx="15" fill="#f3eff7" stroke="#694e85" stroke-width="1.8" /><text x="100" y="1920" font-size="31" fill="#694e85" font-weight="700"><tspan x="100" dy="0">09  梭罗坝</tspan></text><text x="590" y="1918" font-size="20" fill="#694e85" font-weight="600"><tspan x="590" dy="0">押送至恩达</tspan></text><text x="101" y="1961" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">别名：林多坝</tspan></text><text x="101" y="2000" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">原书“林多坝”；夜半到达，天明后再行。</tspan></text></a><path d="M 428 2030 V 2060" stroke="#657269" stroke-width="3" fill="none" marker-end="url(#arrow-maponly)" /><a href="昌都恩达_校注十一对读.html#detail-riyuwa" aria-label="查看日雨娃明细"><rect x="76" y="2076" width="704" height="148" rx="15" fill="#f0f1ec" stroke="#657269" stroke-width="1.8" /><text x="100" y="2118" font-size="31" fill="#657269" font-weight="700"><tspan x="100" dy="0">10  日雨娃</tspan></text><text x="590" y="2116" font-size="20" fill="#657269" font-weight="600"><tspan x="590" dy="0">仅据书图</tspan></text><text x="101" y="2159" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">识读：中</tspan></text><text x="101" y="2198" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">仅据书图；地名识读及今地对应待核。</tspan></text></a><path d="M 428 2228 V 2258" stroke="#694e85" stroke-width="3" fill="none" marker-end="url(#arrow-escort)" /><a href="昌都恩达_校注十一对读.html#detail-enda" aria-label="查看恩达明细"><rect x="76" y="2274" width="704" height="148" rx="15" fill="#f3eff7" stroke="#694e85" stroke-width="1.8" /><text x="100" y="2316" font-size="31" fill="#694e85" font-weight="700"><tspan x="100" dy="0">11  恩达</tspan></text><text x="590" y="2314" font-size="20" fill="#694e85" font-weight="600"><tspan x="590" dy="0">押送至恩达</tspan></text><text x="101" y="2357" font-size="22" fill="#44524b" font-weight="400"><tspan x="101" dy="0">识读：高</tspan></text><text x="101" y="2396" font-size="22" fill="#26332f" font-weight="400"><tspan x="101" dy="0">本人实际到达；第三日约10时抵、13时启返。</tspan></text></a><rect x="850" y="294" width="474" height="397" rx="14" fill="#edf4f7" stroke="#d7dbd3" stroke-width="1.4" /><text x="876" y="338" font-size="27" fill="#215d83" font-weight="650"><tspan x="876" dy="0">先看这条时间线</tspan></text><text x="876" y="382" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">首晚：俄洛桥边军哨营留宿。</tspan></text><text x="876" y="436" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">第二夜：纳贡塘遭俘，押经甲木桥，夜</tspan></text><text x="876" y="469" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">半到梭罗坝并短暂休息。</tspan></text><text x="876" y="523" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">第三日：约10时到恩达；约13时启返；</tspan></text><text x="876" y="556" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">午夜回到昌都。</tspan></text><text x="876" y="610" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">往返约3日、2夜，是相对分日推算；原</tspan></text><text x="876" y="643" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">书未自计全程三日。</tspan></text><rect x="850" y="715" width="474" height="256" rx="14" fill="#edf5ef" stroke="#d7dbd3" stroke-width="1.4" /><text x="876" y="759" font-size="27" fill="#346d58" font-weight="650"><tspan x="876" dy="0">到恩达之后：获释返程</tspan></text><text x="876" y="803" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">正文返程明确复经纳贡塘、纳贡山、浪</tspan></text><text x="876" y="836" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">荡沟、俄洛桥，至昌都。</tspan></text><text x="876" y="890" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">返程没有逐名重述梭罗坝、甲木桥；不</tspan></text><text x="876" y="923" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">把同路可能性写成逐站已证实。</tspan></text><rect x="850" y="995" width="474" height="256" rx="14" fill="#fff6e7" stroke="#d7dbd3" stroke-width="1.4" /><text x="876" y="1039" font-size="27" fill="#6d5743" font-weight="650"><tspan x="876" dy="0">两座图上桥名，保留差异</tspan></text><text x="876" y="1083" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">书图把近城西藏桥与较西的俄洛桥分列</tspan></text><text x="876" y="1116" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">。校注却称俄洛桥番名西藏桥。</tspan></text><text x="876" y="1170" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">这里只保留称名矛盾，不确定它们是同</tspan></text><text x="876" y="1203" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">一古桥或两座不同古桥。</tspan></text><rect x="850" y="1275" width="474" height="343" rx="14" fill="#f3eff7" stroke="#d7dbd3" stroke-width="1.4" /><text x="876" y="1319" font-size="27" fill="#694e85" font-weight="650"><tspan x="876" dy="0">原述里数：组合段不拆分</tspan></text><text x="876" y="1363" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">恩达→梭罗坝：十余里；再至甲木桥：</tspan></text><text x="876" y="1396" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">数里；再至纳贡塘：十里。</tspan></text><text x="876" y="1450" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">纳贡塘翻山至浪荡沟：约四十里；浪荡</tspan></text><text x="876" y="1483" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">沟经俄洛桥至昌都：六十里。</tspan></text><text x="876" y="1537" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">这些是校注原述；正文另有异说，详见</tspan></text><text x="876" y="1570" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">对读页。旧作两站，不等于两日。</tspan></text><rect x="850" y="1642" width="474" height="430" rx="14" fill="#fffef9" stroke="#d7dbd3" stroke-width="1.4" /><text x="876" y="1686" font-size="27" fill="#44524b" font-weight="650"><tspan x="876" dy="0">旁注地点，不强插主链</tspan></text><text x="876" y="1730" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">果角塘：浪荡沟至纳贡山之间的谷地标</tspan></text><text x="876" y="1763" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">签，是否为停驻节点未明。</tspan></text><text x="876" y="1817" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">陈渠珍被擒处：纳贡塘附近事件位置，</tspan></text><text x="876" y="1850" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">营房／民居确址未定。</tspan></text><text x="876" y="1904" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">云南桥：图中位于昌都南侧，另属澜沧</tspan></text><text x="876" y="1937" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">江方向。</tspan></text><text x="876" y="1991" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">瓦合大山：校注背景，不据此认定此行</tspan></text><text x="876" y="2024" font-size="22" fill="#3e4a45" font-weight="400"><tspan x="876" dy="0">另翻该山。</tspan></text><line x1="76" y1="2518" x2="1324" y2="2518" stroke="#c9cfc5" /><text x="78" y="2562" font-size="22" fill="#4c5b53" font-weight="400"><tspan x="78" dy="0">依据：用户书影、第二章正文与任乃强校注十一。甲令塘、日雨娃等保留识读置信度。</tspan></text><text x="78" y="2601" font-size="22" fill="#4c5b53" font-weight="400"><tspan x="78" dy="0">本图只表达文字顺序和叙事阶段，不是古道轨迹、导航图或可量取距离的地理图。</tspan></text></svg>
